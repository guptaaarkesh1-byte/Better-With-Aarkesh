<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bwaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1612" />
      <stop offset="100%" stop-color="#0E0A08" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE673F" />
      <stop offset="100%" stop-color="#B8441F" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bwaGradient)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#accentGradient)" stroke-width="8" stroke-opacity="0.6" />

  <!-- Inner Terracotta Accent Circle -->
  <circle cx="256" cy="256" r="180" fill="#C9542F" fill-opacity="0.1" stroke="#C9542F" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Monogram "B" with Serifs and Warm Gold/White Tone -->
  <g filter="url(#shadow)">
    <!-- Main Serif "B" -->
    <path d="M 175 125 
             L 285 125 
             C 340 125, 375 150, 375 195 
             C 375 228, 350 250, 315 258 
             C 360 266, 390 292, 390 335 
             C 390 385, 345 415, 280 415 
             L 175 415 
             Z 
             M 235 175 
             L 235 240 
             L 275 240 
             C 305 240, 322 225, 322 205 
             C 322 185, 305 175, 275 175 
             Z 
             M 235 285 
             L 235 365 
             L 280 365 
             C 315 365, 335 350, 335 325 
             C 335 300, 315 285, 280 285 
             Z" 
          fill="#FAF4EB" />
  </g>

  <!-- Clarity Spark Accent in Terracotta -->
  <path d="M 390 135 Q 405 150 420 150 Q 405 150 390 165 Q 375 150 360 150 Q 375 150 390 135 Z" fill="#C9542F" />
</svg>